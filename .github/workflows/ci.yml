name: Java CI/CD Automation Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Test Phase
      run: mvn test

    - name: Run Maven Package Phase
      run: mvn package

    - name: Upload Build Artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: java-app-package
        path: target/*.jar
        retention-days: 5